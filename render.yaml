services:
  - type: web
    name: slack-bot-project-brok
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: CONFLUENCE_URL
        sync: false
      - key: CONFLUENCE_USERNAME
        sync: false
      - key: CONFLUENCE_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SLACK_API_KEY
        sync: false
