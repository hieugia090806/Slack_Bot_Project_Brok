# fly.toml app configuration file generated for slack-bot-project-brok-glimmering-meadowlark-3127 on 2026-11-11T14:53:00+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'slack-bot-project-brok-glimmering-meadowlark-3127'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[http_service.concurrency]
  type = 'connections'
  hard_limit = 25
  soft_limit = 20

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
